<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11160f">
<title>Procura — marketplace de compras da sua região</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f6f5f0; --panel:#ffffff; --panel2:#f0efe8; --line:#e2e0d6; --ink:#15191a; --muted:#6b706b;
  --accent:#ffcf3f; --accent-ink:#1b1600; --dark:#11160f; --dark2:#1c2419;
  --ok:#1f9d63; --warn:#d0542b; --info:#2d6cdf;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0}
.logo{font:700 26px/1 var(--display);letter-spacing:-.03em}
.logo b{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:13px;color:var(--muted)}
.eyebrow{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 16px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#cfccbf}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(.97)}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.danger{color:var(--warn)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:500}
.in{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.in:focus{border-color:var(--info);outline:none}
textarea.in{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.form{display:flex;flex-direction:column;gap:14px}
.err{color:var(--warn);font-size:13px;margin-top:4px}
.okt{color:var(--ok);font-size:13px;margin-top:4px}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--dark)}
.seg{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:12px}
.seg button{flex:1;border:0;background:none;padding:9px 12px;border-radius:9px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* login */
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.hero{background:var(--dark);color:#f2f5ef;padding:48px 56px;display:flex;flex-direction:column;gap:28px;position:relative;overflow:hidden}
.hero .logo{font-size:34px}
.hero h1{font-size:44px;line-height:1.05;max-width:520px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:#b9c2b5;max-width:470px;margin:0;font-size:16px}
.hero ul{list-style:none;padding:0;margin:0;display:grid;gap:12px;max-width:470px}
.hero li{display:flex;gap:12px;align-items:flex-start;color:#dfe5dc}
.hero li i{font-style:normal;flex:0 0 28px;height:28px;border-radius:8px;background:var(--dark2);display:grid;place-items:center;color:var(--accent);font:600 13px var(--mono)}
.appbox{margin-top:auto;background:var(--dark2);border:1px solid #2c3628;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;max-width:520px}
.appbox b{font:700 18px var(--display)}
.appbox .row{display:flex;gap:10px;flex-wrap:wrap}
.appbox .btn{border-color:#3a4634;background:transparent;color:#fff}
.appbox .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.auth-side{display:grid;place-items:center;padding:40px 24px}
.auth-card{width:100%;max-width:470px;display:flex;flex-direction:column;gap:18px}
.auth-card h2{font-size:28px}
.cobox{background:var(--panel2);border-radius:12px;padding:12px 14px;display:grid;gap:2px;font-size:14px}

/* app: cabeçalho no topo (estilo marketplace) */
.bar{background:var(--accent);color:var(--accent-ink);position:sticky;top:0;z-index:5;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.bar-in{max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:20px}
.bar .logo{text-decoration:none}
.bar .logo b{color:#fff;-webkit-text-stroke:1px var(--accent-ink)}
.bar form{flex:1;display:flex;max-width:620px;background:#fff;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bar form input{flex:1;border:0;background:none;padding:11px 14px;font-size:15px;min-width:0}
.bar form input:focus{outline:none}
.bar form button{border:0;background:none;padding:0 16px;border-left:1px solid var(--line);font-weight:700}
.bar .who{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:14px;white-space:nowrap}
.bar .who b{max-width:200px;overflow:hidden;text-overflow:ellipsis}
.bar .who button{border:0;background:none;padding:0;font-weight:600;text-decoration:underline}
nav{max-width:1200px;margin:0 auto;padding:0 24px 8px;display:flex;gap:4px;flex-wrap:wrap}
nav a{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600;color:rgba(27,22,0,.75)}
nav a:hover{background:rgba(255,255,255,.4);color:var(--accent-ink)}
nav a[aria-current="page"]{background:rgba(255,255,255,.65);color:var(--accent-ink)}
nav a .n{font:600 11px var(--mono);background:var(--warn);color:#fff;border-radius:999px;padding:1px 7px}
main{padding:32px 24px 60px;max-width:1200px;width:100%;margin:0 auto}
/* início do comprador */
.home{display:flex;flex-direction:column;gap:28px;padding-top:12px}
.home h1{font-size:36px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;min-height:170px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--ink);transform:translateY(-2px)}
.tile .ic{width:44px;height:44px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:22px}
.tile b{font:700 19px var(--display)}
.tile span{font-size:14px;color:var(--muted)}
.tile.hi{background:var(--dark);border-color:var(--dark);color:#fff}
.tile.hi span{color:#b9c2b5} .tile.hi .ic{background:var(--accent)}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.top h1{font-size:32px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.empty{text-align:center;color:var(--muted);padding:56px 20px;border:1px dashed var(--line);border-radius:16px;background:var(--panel)}
.empty b{display:block;color:var(--ink);font:700 20px var(--display);margin-bottom:6px}

table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:12px 14px;background:var(--panel2)}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--panel2);display:block}
.thumb.ph{display:grid;place-items:center;color:var(--muted);font-size:18px}
.pill{display:inline-block;font:600 11px var(--mono);padding:3px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.ok{background:#e3f5ec;color:var(--ok)} .pill.warn{background:#fbe9e2;color:var(--warn)} .pill.info{background:#e5edfb;color:var(--info)} .pill.acc{background:#fff3c7;color:#6b5100}

/* busca */
.searchbar{display:grid;grid-template-columns:2.4fr 1fr 1fr auto;gap:12px;align-items:end}
.opts{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:14px}
.results{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.res{display:grid;grid-template-columns:84px 1fr auto;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.res.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.res img,.res .ph{width:84px;height:84px;border-radius:10px;object-fit:cover;background:var(--panel2);display:grid;place-items:center;color:var(--muted)}
.res h3{font:700 17px var(--display);margin:0 0 2px}
.res .meta{font-size:13px;color:var(--muted)}
.res .buy{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:190px}
.price{font:700 22px var(--display);font-variant-numeric:tabular-nums}
.unit{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:6px;margin-right:6px;vertical-align:2px}
.stars{color:#e0a800;white-space:nowrap;font-size:13px} .stars b{color:var(--ink)}

/* carrinho / pedidos */
.shop{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.shop-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--panel2);flex-wrap:wrap}
.line{display:grid;grid-template-columns:48px 1fr 120px 120px 40px;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.qty{width:100%}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 20px;font-variant-numeric:tabular-nums}
.sum .t{font:700 22px var(--display)}
.order{display:flex;flex-direction:column;gap:12px}
.order-h{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.items{display:flex;flex-direction:column;gap:6px;font-size:14px}
.items div{display:flex;justify-content:space-between;gap:10px}
.steps{display:flex;gap:4px;margin:4px 0}
.steps span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps span.on{background:var(--ok)}
.rate{display:flex;flex-direction:column;gap:8px;background:var(--panel2);border-radius:12px;padding:12px}
.rate-stars{display:flex;gap:4px;align-items:center}
.rate-stars button{border:0;background:none;font-size:26px;line-height:1;color:#d5d2c6;padding:0 2px}
.rate-stars button.on{color:#e0a800}
.rate-stars .z{font:600 12px var(--mono);border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff;margin-left:6px;color:var(--muted)}
.rate-stars .z.on{background:var(--warn);color:#fff;border-color:var(--warn)}

/* fotos do item */
.photos{display:flex;gap:10px;flex-wrap:wrap}
.photo{position:relative;width:110px;height:110px;border-radius:12px;overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo button{position:absolute;top:6px;right:6px;border:0;border-radius:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:3px 7px}
.photo.add{display:grid;place-items:center;border-style:dashed;color:var(--muted);font-weight:600;cursor:pointer;text-align:center;font-size:13px}
details summary{cursor:pointer;font-weight:600}

/* procuras */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.pc:hover{border-color:#cfccbf}
.pc img,.pc .ph{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--panel2);display:grid;place-items:center;color:var(--muted);font-size:28px}
.pc div{padding:12px}
.pc h3{font:700 16px var(--display);margin:0 0 4px}
dialog{border:0;border-radius:18px;padding:0;max-width:760px;width:calc(100% - 32px);box-shadow:0 30px 80px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(17,22,15,.55)}
.dlg{display:grid;grid-template-columns:280px 1fr;max-height:85vh}
.dlg>img,.dlg>.ph{width:100%;height:100%;object-fit:cover;background:var(--panel2);min-height:260px}
.dlg .body{padding:22px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.offers{display:flex;flex-direction:column;gap:6px}
.offers a{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none}
.offers a:hover{border-color:var(--info)}
.offers b{font:700 16px var(--display);white-space:nowrap}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px} dt{color:var(--muted)} dd{margin:0}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:99;max-width:90vw}
.spin{color:var(--muted);padding:30px 0;text-align:center}

@media (max-width:980px){
  .auth{grid-template-columns:1fr} .hero{padding:32px 24px} .hero h1{font-size:34px}
  .bar-in{flex-wrap:wrap;padding:10px 16px;gap:10px} .bar form{order:3;flex-basis:100%;max-width:none} .bar .who b{display:none}
  nav{padding:0 16px 8px} main{padding:20px 16px 48px} .tiles{grid-template-columns:1fr 1fr}
  .searchbar,.grid3,.grid4{grid-template-columns:1fr 1fr} .res{grid-template-columns:64px 1fr} .res .buy{grid-column:1/-1;align-items:stretch}
  .line{grid-template-columns:48px 1fr 90px 40px} .line .lt{display:none} .dlg{grid-template-columns:1fr} .dlg>img,.dlg>.ph{max-height:220px}
  table{display:block;overflow-x:auto}
}
@media (max-width:560px){ .grid2,.searchbar,.grid3,.grid4,.tiles{grid-template-columns:1fr} }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
"use strict";
/* A anon key é pública por design: quem protege os dados são as regras (RLS) do banco. */
const CONFIG = { SUPABASE_URL: "https://npvsptyswgzklmtjzedl.supabase.co", SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wdnNwdHlzd2d6a2xtdGp6ZWRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0Njk3MDcsImV4cCI6MjEwNjA0NTcwN30.ro9IvkqmW3BMItN4-BE-8lG5vL0lP3ryU7qZNN54mmA" };
const APP_WEB_URL = "app/";
const APK_URL = "https://github.com/facincanitech/procura/releases/download/latest/procura.apk";
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });

const CATS = ["Material de construção","Elétrica","Hidráulica","Ferramentas","Tintas","Madeira","Eletrônicos","Eletrodomésticos","Casa e móveis","Cozinha","Moda e acessórios","Esporte e lazer","Automotivo","Beleza e cuidado","Papelaria e livros","Brinquedos","Pet","Bebê","Alimentos e bebidas","Agro","Outros"];
const UNIDADES = ["un","milheiro","saco","kg","tonelada","m","m²","m³","litro","caixa","pacote","par","rolo","barra","galão"];
const STATUS = { aguardando_pagamento:["Aguardando pagamento","acc"], pago:["Pago","info"], separando:["Separando","info"], pronto:["Pronto","info"],
  em_transito:["Em trânsito","info"], entregue:["Entregue","ok"], cancelado:["Cancelado","warn"], devolvido:["Devolvido","warn"] };
const FLUXO = ["pago","separando","pronto","em_transito","entregue"];
const PAGAMENTOS = { pix:"PIX", credito:"Cartão de crédito", debito:"Cartão de débito", dinheiro:"Dinheiro", boleto:"Boleto", faturado:"Faturado (a prazo)" };
const pagTxt = arr => (arr||[]).map(k=>PAGAMENTOS[k]||k).join(" · ");
const pagChecks = (id, sel) => `<div class="opts" id="${id}" style="margin-top:0">${Object.entries(PAGAMENTOS).map(([k,t])=>`<label class="check"><input type="checkbox" value="${k}"${(sel||[]).includes(k)?" checked":""}> ${t}</label>`).join("")}</div>`;
const pagLidos = id => $(`#${id} input:checked`).map(i=>i.value);

/* ---------- utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = n => Number(n||0).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
const num = n => Number(n||0).toLocaleString("pt-BR", { maximumFractionDigits:2 });
const dataBR = d => new Date(d).toLocaleString("pt-BR", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
const LS = { get:k=>{ try{ return localStorage.getItem(k); }catch{ return null; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch{} } };
function parseNum(v){ v=String(v??"").trim(); if(!v) return null; if(/,/.test(v)) v=v.replace(/\./g,"").replace(",","."); const n=parseFloat(v); return isFinite(n)?n:null; }
function safeURL(u){ try{ const x=new URL(u); return /^https?:$/.test(x.protocol)?x.href:null; }catch{ return null; } }
let tt; function toast(m){ let t=$(".toast"); if(!t){ t=document.createElement("div"); t.className="toast"; document.body.appendChild(t); } t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true, 3200); }
function errMsg(e){
  const m = (e && (e.message || e.error_description)) || String(e);
  if(/Invalid login credentials/i.test(m)) return "E-mail ou senha errados.";
  if(/already registered|already been registered/i.test(m)) return "Esse e-mail já tem conta. Use Entrar.";
  if(/perfis_cpf_key/.test(m)) return "Esse CPF já tem conta.";
  if(/perfis_cnpj_key/.test(m)) return "Esse CNPJ já tem conta.";
  if(/Password should be/i.test(m)) return "A senha precisa ter pelo menos 6 caracteres.";
  if(/Failed to fetch|NetworkError/i.test(m)) return "Sem conexão. Tente de novo.";
  return m;
}
function pill(st){ const [t,c]=STATUS[st]||[st,""]; return `<span class="pill ${c}">${esc(t)}</span>`; }
function starsHTML(media, n){ if(!n) return `<span class="stars muted">sem avaliações</span>`; const f=Math.round(media); return `<span class="stars" title="${media} de 5">${"★".repeat(f)}${"☆".repeat(5-f)} <b>${String(media).replace(".",",")}</b> <span class="muted">(${n})</span></span>`; }
const zap = cel => { const d=onlyDigits(cel); return d ? `https://wa.me/55${d}` : null; };

/* ---------- CPF, CNPJ, CEP ---------- */
const onlyDigits = v => String(v||"").replace(/\D/g,"");
function validCPF(v){ const c=onlyDigits(v); if(c.length!==11||/^(\d)\1{10}$/.test(c)) return false;
  const dv=n=>{ let s=0; for(let i=0;i<n;i++) s+=+c[i]*(n+1-i); const r=(s*10)%11; return r===10?0:r; };
  return dv(9)===+c[9] && dv(10)===+c[10]; }
// Aceita o CNPJ numérico e o novo alfanumérico (Receita Federal, a partir de jul/2026)
const cnpjClean = v => String(v||"").toUpperCase().replace(/[^0-9A-Z]/g,"");
function validCNPJ(v){ const c=cnpjClean(v); if(!/^[0-9A-Z]{12}\d{2}$/.test(c) || /^(.)\1{13}$/.test(c)) return false;
  const val=ch=>ch.charCodeAt(0)-48;
  const dv=len=>{ const w=len===12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2]; let s=0; for(let i=0;i<len;i++) s+=val(c[i])*w[i]; const r=s%11; return r<2?0:11-r; };
  return dv(12)===+c[12] && dv(13)===+c[13]; }
const maskCPF = v => onlyDigits(v).slice(0,11).replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2");
const maskCNPJ = v => cnpjClean(v).slice(0,14).replace(/^(\w{2})(\w)/,"$1.$2").replace(/^(\w{2})\.(\w{3})(\w)/,"$1.$2.$3").replace(/\.(\w{3})(\w)/,".$1/$2").replace(/(\w{4})(\d{1,2})$/,"$1-$2");
const maskTel = v => { const d=onlyDigits(v).slice(0,11); return d.length>10? d.replace(/(\d{2})(\d{5})(\d{0,4})/,"($1) $2-$3") : d.replace(/(\d{2})(\d{4})(\d{0,4})/,"($1) $2-$3").replace(/[-(\s)]+$/,""); };
const maskCEP = v => onlyDigits(v).slice(0,8).replace(/(\d{5})(\d)/,"$1-$2");
async function lookupCNPJ(cnpj){
  const c=cnpjClean(cnpj);
  try{ const r=await fetch(`https://brasilapi.com.br/api/cnpj/v1/${c}`); if(r.ok){ const j=await r.json();
    return { cnpj:c, razao:j.razao_social, fantasia:j.nome_fantasia, situacao:j.descricao_situacao_cadastral, atividade:j.cnae_fiscal_descricao,
      endereco:[j.descricao_tipo_de_logradouro, j.logradouro, j.numero].filter(Boolean).join(" ")+(j.bairro?` · ${j.bairro}`:""), cidade:j.municipio, uf:j.uf, cep:j.cep, telefone:j.ddd_telefone_1 }; }
    if(r.status===404) return {notFound:true};
  }catch{}
  try{ const r=await fetch(`https://publica.cnpj.ws/cnpj/${c}`); if(r.ok){ const j=await r.json(), e=j.estabelecimento||{};
    return { cnpj:c, razao:j.razao_social, fantasia:e.nome_fantasia, situacao:e.situacao_cadastral, atividade:e.atividade_principal?.descricao,
      endereco:[e.tipo_logradouro,e.logradouro,e.numero].filter(Boolean).join(" ")+(e.bairro?` · ${e.bairro}`:""), cidade:e.cidade?.nome, uf:e.estado?.sigla, cep:e.cep, telefone:e.ddd1&&e.telefone1?e.ddd1+e.telefone1:null }; }
    if(r.status===404) return {notFound:true};
  }catch{}
  return null;
}
async function lookupCEP(cep){
  try{ const r=await fetch(`https://brasilapi.com.br/api/cep/v2/${onlyDigits(cep)}`); if(!r.ok) return null; const j=await r.json();
    const co=j.location?.coordinates; return { cidade:j.city, uf:j.state, rua:[j.street,j.neighborhood].filter(Boolean).join(" · "), lat:co?.latitude?+co.latitude:null, lng:co?.longitude?+co.longitude:null }; }catch{ return null; }
}

function authForm(modo, tipo){

  if(modo==="entrar"){
    c.innerHTML = `<div><p class="eyebrow">Bem-vindo</p><h2>Entrar no Procura</h2></div>
      <form class="form" id="f-login" novalidate>
        <div><label class="f" for="l-email">E-mail</label><input class="in" id="l-email" type="email" autocomplete="email" required></div>
        <div><label class="f" for="l-senha">Senha</label><input class="in" id="l-senha" type="password" autocomplete="current-password" required></div>
        <button class="btn primary block" type="submit">Entrar</button>
      </form>
      <div class="small">Ainda não tem conta? <a href="#" id="go-cad"><b>Criar conta</b></a> · <a href="#" id="go-reset">Esqueci a senha</a></div>`;
    $("#go-cad").onclick = e => { e.preventDefault(); authForm("criar"); };
    $("#go-reset").onclick = async e => { e.preventDefault(); const em=$("#l-email").value.trim(); if(!em) return toast("Digite seu e-mail primeiro");
      const { error } = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin+location.pathname }); toast(error?errMsg(error):"Enviamos um link para seu e-mail"); };
    $("#f-login").onsubmit = async e => { e.preventDefault(); const b=e.submitter; b.disabled=true;
      const { error } = await sb.auth.signInWithPassword({ email:$("#l-email").value.trim(), password:$("#l-senha").value });
      b.disabled=false; if(error) return toast(errMsg(error)); await afterAuth(); };
    return;
  }
  const completar = modo==="completar";
  c.innerHTML = `<div><p class="eyebrow">${completar?"Falta pouco":"Nova conta"}</p><h2>${completar?"Complete seu cadastro":"Criar conta"}</h2></div>
    <div class="seg" role="group" aria-label="Tipo de conta">
      <button type="button" data-t="comprador" aria-pressed="${tipo==="comprador"}">Comprador · CPF</button>
      <button type="button" data-t="vendedor" aria-pressed="${tipo==="vendedor"}">Vendedor · CNPJ</button>
    </div>
    <form class="form" id="f-cad" novalidate>
      ${tipo==="comprador" ? `
        <div><label class="f" for="c-nome">Nome completo</label><input class="in" id="c-nome" autocomplete="name"></div>
        <div class="grid2">
          <div><label class="f" for="c-cpf">CPF</label><input class="in" id="c-cpf" inputmode="numeric" placeholder="000.000.000-00"><div id="c-cpf-msg"></div></div>
          <div><label class="f" for="c-cel">Celular / WhatsApp</label><input class="in" id="c-cel" inputmode="tel" placeholder="(17) 99999-9999"></div>
        </div>
        <div class="grid2">
          <div><label class="f" for="c-cep">CEP</label><input class="in" id="c-cep" inputmode="numeric" placeholder="00000-000"></div>
          <div><label class="f" for="c-cidade">Cidade</label><input class="in" id="c-cidade" placeholder="preenche pelo CEP"></div>
        </div>` : `
        <div><label class="f" for="v-cnpj">CNPJ</label>
          <div style="display:flex;gap:8px"><input class="in" id="v-cnpj" placeholder="00.000.000/0000-00" style="flex:1"><button class="btn" type="button" id="v-buscar">Buscar</button></div>
          <div id="v-cnpj-msg"></div></div>
        <div class="cobox" id="v-dados" hidden></div>
        <div class="grid2">
          <div><label class="f" for="v-fantasia">Nome da loja</label><input class="in" id="v-fantasia"></div>
          <div><label class="f" for="v-cel">WhatsApp da loja</label><input class="in" id="v-cel" inputmode="tel" placeholder="(17) 99999-9999"></div>
        </div>
        <div><label class="f" for="v-raio">Atende até</label><select class="in" id="v-raio"><option value="10">10 km</option><option value="30" selected>30 km</option><option value="100">100 km</option><option value="500">500 km</option></select></div>
        <div><label class="f">Formas de pagamento que a loja aceita</label>${pagChecks("v-pag",["pix","dinheiro","credito","debito"])}</div>`}
      ${completar ? "" : `<div class="grid2">
        <div><label class="f" for="a-email">E-mail</label><input class="in" id="a-email" type="email" autocomplete="email"></div>
        <div><label class="f" for="a-senha">Senha (6+)</label><input class="in" id="a-senha" type="password" autocomplete="new-password"></div>
      </div>`}
      <button class="btn primary block" type="submit">${tipo==="comprador"?"Criar conta de comprador":"Cadastrar minha empresa"}</button>
    </form>
    <div class="small">${tipo==="comprador" ? "O CPF é conferido pelo dígito verificador e fica visível só para você." : "Os dados vêm da base pública do CNPJ. Só empresas com situação ATIVA podem se cadastrar."}</div>
    <div class="small">${completar ? `<a href="#" id="go-sair">Sair</a>` : `Já tem conta? <a href="#" id="go-login"><b>Entrar</b></a>`}</div>`;
  $$("[data-t]", c).forEach(b => b.onclick = () => authForm(modo, b.dataset.t));
  if(completar) $("#go-sair").onclick = e => { e.preventDefault(); sb.auth.signOut(); };
  else $("#go-login").onclick = e => { e.preventDefault(); authForm("entrar"); };

  if(tipo==="comprador"){
    $("#c-cpf").oninput = e => { e.target.value=maskCPF(e.target.value); const d=onlyDigits(e.target.value);
      $("#c-cpf-msg").innerHTML = d.length===11 ? (validCPF(d)?`<div class="okt">CPF válido</div>`:`<div class="err">CPF inválido. Confira os números.</div>`) : ""; };
    $("#c-cel").oninput = e => e.target.value=maskTel(e.target.value);
    $("#c-cep").oninput = async e => { e.target.value=maskCEP(e.target.value); if(onlyDigits(e.target.value).length===8){ const g=await lookupCEP(e.target.value); if(g){ S.cep=g; $("#c-cidade").value=`${g.cidade}/${g.uf}`; } } };
  } else {
    const buscar = async () => {
      const v=$("#v-cnpj").value, msg=$("#v-cnpj-msg");
      if(!validCNPJ(v)){ msg.innerHTML=`<div class="err">CNPJ inválido. Confira os números.</div>`; return; }
      msg.innerHTML=`<div class="small">Consultando a base pública…</div>`;
      const d = await lookupCNPJ(v);
      if(!d){ msg.innerHTML=`<div class="err">Não consegui consultar agora. Tente de novo em instantes.</div>`; return; }
      if(d.notFound){ msg.innerHTML=`<div class="err">CNPJ não encontrado.</div>`; return; }
      const ativa = /^ativa$/i.test(String(d.situacao||"").trim());
      S.cnpj = ativa ? d : null;
      msg.innerHTML = ativa ? `<div class="okt">Empresa ATIVA</div>` : `<div class="err">Situação: ${esc(d.situacao||"desconhecida")}. Só empresas ATIVAS podem se cadastrar.</div>`;
      $("#v-dados").hidden=false;
      $("#v-dados").innerHTML=`<b>${esc(d.razao)}</b><span>${esc(d.atividade||"")}</span><span class="small">${esc(d.endereco||"")} · ${esc(d.cidade||"")}/${esc(d.uf||"")}</span>`;
      if(!$("#v-fantasia").value) $("#v-fantasia").value = d.fantasia || d.razao || "";
      if(!$("#v-cel").value && d.telefone) $("#v-cel").value = maskTel(d.telefone);
    };
    $("#v-cnpj").oninput = e => { e.target.value=maskCNPJ(e.target.value); S.cnpj=null; if(cnpjClean(e.target.value).length===14) buscar(); else { $("#v-cnpj-msg").innerHTML=""; $("#v-dados").hidden=true; } };
    $("#v-buscar").onclick = buscar;
    $("#v-cel").oninput = e => e.target.value=maskTel(e.target.value);
  }

  $("#f-cad").onsubmit = async e => {
    e.preventDefault();
    const btn = e.submitter;
    let perfil;
    if(tipo==="comprador"){
      const nome=$("#c-nome").value.trim(), cpf=onlyDigits($("#c-cpf").value);
      if(nome.split(/\s+/).length<2) return toast("Digite nome e sobrenome");
      if(!validCPF(cpf)) return toast("CPF inválido");
      if(onlyDigits($("#c-cel").value).length<10) return toast("Digite o celular com DDD");
      const [cid,uf] = $("#c-cidade").value.split("/").map(s=>s&&s.trim());
      perfil = { tipo:"comprador", nome, cpf, celular:$("#c-cel").value, cep:$("#c-cep").value||null, cidade:cid||null, uf:uf||null, lat:S.cep?.lat??null, lng:S.cep?.lng??null };
    } else {
      if(!S.cnpj) return toast("Busque um CNPJ com situação ATIVA");
      if(onlyDigits($("#v-cel").value).length<10) return toast("Digite o WhatsApp com DDD");
      const d=S.cnpj, g = d.cep ? await lookupCEP(d.cep) : null;
      perfil = { tipo:"vendedor", nome:d.razao||d.fantasia, cnpj:d.cnpj, razao_social:d.razao||null, fantasia:$("#v-fantasia").value.trim()||d.fantasia||d.razao,
        atividade:d.atividade||null, situacao:"ATIVA", endereco:d.endereco||null, cidade:d.cidade||null, uf:d.uf||null, cep:d.cep||null,
        celular:$("#v-cel").value, raio_entrega_km:+$("#v-raio").value, pagamentos:pagLidos("v-pag"), lat:g?.lat??null, lng:g?.lng??null };
      if(!perfil.pagamentos.length) return toast("Marque pelo menos uma forma de pagamento");
    }
    btn.disabled = true;
    try{
      if(!completar){
        const email=$("#a-email").value.trim(), password=$("#a-senha").value;
        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error("Digite um e-mail válido");
        if(password.length<6) throw new Error("A senha precisa ter pelo menos 6 caracteres");
        const { data, error } = await sb.auth.signUp({ email, password });
        if(error) throw error;
        if(!data.session){ LS.set("procura.pendente", JSON.stringify(perfil)); toast("Conta criada! Confirme pelo link no seu e-mail e depois entre."); authForm("entrar"); return; }
      }
      await criarPerfil(perfil);
      toast(tipo==="comprador" ? "Conta criada" : "Empresa cadastrada");
      await afterAuth();
    }catch(err){ toast(errMsg(err)); }
    finally{ btn.disabled = false; }
  };
}
async function criarPerfil(perfil){
  const { data:{ user } } = await sb.auth.getUser();
  const { error } = await sb.from("perfis").insert({ ...perfil, id:user.id, email:user.email });
  if(error) throw error;
}
async function afterAuth(){
  await loadPerfil();
  // cadastro feito antes de confirmar o e-mail: grava o perfil no primeiro login
  if(S.user && !S.perfil){ const p=LS.get("procura.pendente"); if(p){ try{ await criarPerfil(JSON.parse(p)); LS.set("procura.pendente",""); await loadPerfil(); }catch(e){ toast(errMsg(e)); } } }
  if(!S.perfil) return renderAuth("completar");
  location.hash = S.perfil.tipo==="vendedor" ? "#itens" : "#inicio";
  route();
}

  V[view](arg);

async function buscar(){
  const q=$("#b-q").value.trim(), qtd=parseNum($("#b-qtd").value)||1, raio=$("#b-raio").value, pronta=$("#b-pronta").checked;
  if(q.length<2) return toast("Digite o que você procura");
  const lat = S.coords?.lat ?? S.perfil.lat, lng = S.coords?.lng ?? S.perfil.lng;
  $("#res").innerHTML = `<div class="spin">Procurando nas lojas…</div>`;
  const { data, error } = await sb.rpc("buscar_produtos", { p_q:q, p_qtd:qtd, p_lat:lat??null, p_lng:lng??null, p_raio_km:raio?+raio:null, p_pronta:pronta });
  if(error){ if($("#res")) $("#res").innerHTML=""; return toast(errMsg(error)); }
  S.busca = { q, qtd, raio, pronta, rows:data };
  if($("#res")) renderRes(data, S.busca);
}
function renderRes(rows, b){
  const el=$("#res");
  if(!rows.length){ el.innerHTML=`<div class="empty"><b>Nenhuma loja tem isso agora</b>Tente outras palavras, aumente a distância${b.pronta?" ou desmarque “só pronta entrega”":""}.</div>`; return; }
  el.innerHTML = `<div class="small">${rows.length} ${rows.length>1?"ofertas":"oferta"} para <b>${esc(num(b.qtd))}</b> · do menor para o maior preço total</div>` + rows.map((r,i)=>`
    <div class="res${i===0?" best":""}">
      ${r.fotos?.[0]?`<img src="${esc(r.fotos[0])}" alt="" loading="lazy">`:`<div class="ph">▢</div>`}
      <div>
        <h3>${i===0?`<span class="tag">menor preço</span>`:""}${esc(r.nome)}</h3>
        <div class="meta">${esc([r.marca,r.modelo].filter(Boolean).join(" · "))}</div>
        <div class="meta"><b style="color:var(--ink)">${esc(r.loja)}</b> · ${starsHTML(r.nota, r.avaliacoes)} · ${esc(r.cidade||"")}${r.uf?"/"+esc(r.uf):""}${r.distancia_km!=null?` · ${String(r.distancia_km).replace(".",",")} km`:""}</div>
        <div class="meta">Pagamento: ${esc(pagTxt(r.pagamentos))}</div>
        <div class="meta">${r.pronta_entrega?`<span class="pill ok">pronta entrega</span> ${num(r.estoque)} ${esc(r.unidade)} em estoque`:`<span class="pill acc">sob encomenda</span>${r.prazo_dias!=null?` · ${r.prazo_dias} dias`:""}`}</div>
      </div>
      <div class="buy">
        <div class="price">${brl(r.total)}</div>
        <div class="unit">${brl(r.preco)} / ${esc(r.unidade)} × ${esc(num(b.qtd))}</div>
        <button class="btn primary sm" data-add="${i}">Adicionar ao carrinho</button>
      </div>
    </div>`).join("");
  $$("[data-add]", el).forEach(btn => btn.onclick = () => {
    const r=rows[+btn.dataset.add], c=cart.get(), ex=c.find(x=>x.produto_id===r.produto_id);
    if(ex) ex.qtd = b.qtd; else c.push({ produto_id:r.produto_id, qtd:b.qtd, nome:r.nome, preco:+r.preco, unidade:r.unidade, loja:r.loja, vendedor:r.vendedor, foto:r.fotos?.[0]||null, pronta:r.pronta_entrega, estoque:+r.estoque, pagamentos:r.pagamentos||[] });
    cart.set(c); toast("Adicionado ao carrinho");
  });
}

          <div class="num lt" style="text-align:right;font-weight:600">${brl(x.preco*x.qtd)}</div>
          <button class="btn sm danger" data-rm="${x.produto_id}" aria-label="Remover">✕</button>
        </div>`).join("")}</div>`).join("")}</div>

        <div id="end-box" hidden><label class="f" for="f-end">Endereço de entrega</label><textarea class="in" id="f-end" placeholder="Rua, número, bairro, cidade, referência">${esc(S.perfil.endereco||"")}</textarea>
          <div class="small" style="margin-top:4px">O frete é combinado com cada loja depois do pagamento.</div></div>
        <div><label class="f" for="f-pag">Forma de pagamento</label>${pags.length?`<select class="in" id="f-pag">${pags.map(k=>`<option value="${k}">${PAGAMENTOS[k]}</option>`).join("")}</select>`
          :`<div class="err">As lojas deste carrinho não têm forma de pagamento em comum. Faça um pedido por loja.</div>`}</div>

        <button class="btn primary block" type="submit">Fechar pedido</button>
        <div class="small">Depois de fechar, o pedido aparece em Compras para pagamento.</div>
      </form>

  if(matchMedia("(max-width:980px)").matches) $(".cartgrid").style.gridTemplateColumns="1fr";

  $$("[data-e]").forEach(b=>b.onclick=()=>{ entrega=b.dataset.e; $$("[data-e]").forEach(x=>x.setAttribute("aria-pressed",x===b)); $("#end-box").hidden=entrega!=="entrega"; });
  $$("[data-q]").forEach(i=>i.onchange=()=>{ const v=parseNum(i.value); const c=cart.get(); const x=c.find(y=>y.produto_id==i.dataset.q); if(!v||v<=0){ toast("Quantidade inválida"); return vCarrinho(); } x.qtd=v; cart.set(c); vCarrinho(); });

  $("#f-fim").onsubmit = async e => { e.preventDefault(); if(!pags.length) return toast("Escolha itens de lojas com forma de pagamento em comum"); const btn=e.submitter; btn.disabled=true;
    const { error } = await sb.rpc("criar_pedido", { p_itens:cart.get().map(x=>({produto_id:x.produto_id,qtd:x.qtd})), p_entrega:entrega, p_endereco:entrega==="entrega"?$("#f-end").value:null, p_pagamento:$("#f-pag")?.value||null });

function rateWidget(id, quem){

function bindRates(root, reload){

  $("#k-cep").oninput=async e=>{ e.target.value=maskCEP(e.target.value); if(onlyDigits(e.target.value).length===8){ geo=await lookupCEP(e.target.value); if(geo){ $("#k-cid").value=geo.cidade||""; $("#k-uf").value=geo.uf||""; if(!$("#k-end").value && geo.rua) $("#k-end").value=geo.rua; $("#k-geo").textContent=geo.lat?"Localização atualizada pelo CEP.":"CEP sem coordenadas: a distância não será calculada."; } } };
  $("#f-conta").onsubmit=async e=>{ e.preventDefault();
    const up={ celular:$("#k-cel").value, cep:$("#k-cep").value||null, endereco:$("#k-end").value||null, cidade:$("#k-cid").value||null, uf:($("#k-uf").value||"").toUpperCase()||null };
    if(vend){ up.fantasia=$("#k-fant").value.trim()||p.fantasia; up.raio_entrega_km=parseNum($("#k-raio").value)||30; up.pagamentos=pagLidos("k-pag"); if(!up.pagamentos.length) return toast("Marque pelo menos uma forma de pagamento"); } else { const n=$("#k-nome").value.trim(); if(n.split(/\s+/).length<2) return toast("Digite nome e sobrenome"); up.nome=n; }
    if(geo?.lat){ up.lat=geo.lat; up.lng=geo.lng; }
    const { error }=await sb.from("perfis").update(up).eq("id",p.id); if(error) return toast(errMsg(error));
    await loadPerfil(); toast("Salvo"); };
}

async function vItens(){
  main().innerHTML = `<div class="top"><div><p class="eyebrow">Catálogo</p><h1>Meus itens</h1></div>
    <div style="display:flex;gap:10px"><input class="in" id="i-f" placeholder="Filtrar…" style="width:220px"><a class="btn primary" href="#item/novo">+ Cadastrar item</a></div></div>
    <div id="tb"><div class="spin">Carregando…</div></div>`;
  const { data, error } = await sb.from("produtos").select("*").order("criado_em",{ascending:false});
  if(error) return toast(errMsg(error));
  if(!$("#tb")) return;
  const draw = f => {
    const rows = data.filter(p=>!f || (p.nome+" "+(p.marca||"")+" "+(p.categoria||"")).toLowerCase().includes(f.toLowerCase()));
    if(!data.length){ $("#tb").innerHTML=`<div class="empty"><b>Nenhum item cadastrado</b>Cadastre o que sua loja vende. Seus itens aparecem para compradores da região que buscarem por eles.<br><br><a class="btn primary" href="#item/novo">+ Cadastrar o primeiro item</a></div>`; return; }
    $("#tb").innerHTML = `<table><thead><tr><th></th><th>Item</th><th>Categoria</th><th class="num">Preço</th><th class="num">Estoque</th><th>Disponibilidade</th><th>Ativo</th><th></th></tr></thead><tbody>
      ${rows.map(p=>`<tr>
        <td>${p.fotos[0]?`<img class="thumb" src="${esc(p.fotos[0])}" alt="">`:`<div class="thumb ph">▢</div>`}</td>
        <td><b>${esc(p.nome)}</b><div class="small">${esc([p.marca,p.modelo].filter(Boolean).join(" · "))}</div></td>
        <td class="small">${esc(p.categoria||"—")}</td>
        <td class="num"><b>${brl(p.preco)}</b><div class="small">/ ${esc(p.unidade)}</div></td>
        <td class="num">${num(p.estoque)}${p.pronta_entrega&&+p.estoque===0?`<div><span class="pill warn">sem estoque</span></div>`:""}</td>
        <td>${p.pronta_entrega?`<span class="pill ok">pronta entrega</span>`:`<span class="pill acc">encomenda${p.prazo_dias!=null?` · ${p.prazo_dias}d`:""}</span>`}</td>
        <td><label class="check"><input type="checkbox" data-at="${p.id}"${p.ativo?" checked":""}></label></td>
        <td style="white-space:nowrap"><a class="btn sm" href="#item/${p.id}">Editar</a> <button class="btn sm danger" data-del="${p.id}">Excluir</button></td>
      </tr>`).join("")}</tbody></table>
      <div class="small" style="margin-top:10px">${data.length} ${data.length>1?"itens":"item"} · desmarque “Ativo” para esconder um item das buscas sem apagar.</div>`;
    $$("[data-at]").forEach(c=>c.onchange=async()=>{ const { error }=await sb.from("produtos").update({ativo:c.checked, atualizado_em:new Date().toISOString()}).eq("id",+c.dataset.at); if(error){ c.checked=!c.checked; return toast(errMsg(error)); } data.find(p=>p.id==c.dataset.at).ativo=c.checked; toast(c.checked?"Item ativo nas buscas":"Item escondido das buscas"); });
    $$("[data-del]").forEach(b=>b.onclick=async()=>{ const p=data.find(x=>x.id==b.dataset.del); if(!confirm(`Excluir "${p.nome}"?`)) return;
      const { error }=await sb.from("produtos").delete().eq("id",p.id); if(error) return toast(errMsg(error));
      const paths=p.fotos.map(u=>storagePath(u,"produtos")).filter(Boolean); if(paths.length) sb.storage.from("produtos").remove(paths);
      data.splice(data.indexOf(p),1); draw($("#i-f").value); toast("Item excluído"); });
  };
  draw(""); $("#i-f").oninput=e=>draw(e.target.value);
}

async function vItem(id){

  const novo = !p.id; let fotos=[...p.fotos];
  const v = x => x==null ? "" : esc(typeof x==="number" ? String(x).replace(".",",") : x);

        <p class="eyebrow" style="margin:0">Fotos</p>
        <div class="photos" id="fotos"></div>
        <input type="file" id="f-foto" accept="image/*" multiple hidden>
      </div>
      <div class="card form">
        <p class="eyebrow" style="margin:0">Produto</p>
        <div><label class="f" for="t-nome">Nome do item *</label><input class="in" id="t-nome" maxlength="160" placeholder="ex: Tijolo cerâmico 8 furos 9x19x19" value="${v(p.nome)}"></div>
        <div class="grid3">

          <div><label class="f" for="t-cat">Categoria</label><select class="in" id="t-cat"><option value="">Escolha…</option>${CATS.map(c=>`<option${c===p.categoria?" selected":""}>${c}</option>`).join("")}</select></div>

      </div>
      <div class="card form">
        <p class="eyebrow" style="margin:0">Preço e estoque</p>
        <div class="grid3">
          <div><label class="f" for="t-preco">Preço (R$) *</label><input class="in" id="t-preco" inputmode="decimal" placeholder="0,00" value="${p.preco!==""?v(Number(p.preco).toFixed(2)):""}"></div>
          <div><label class="f" for="t-un">Por</label><select class="in" id="t-un">${UNIDADES.map(u=>`<option${u===p.unidade?" selected":""}>${u}</option>`).join("")}</select></div>
          <div><label class="f" for="t-est">Estoque</label><input class="in" id="t-est" inputmode="decimal" value="${v(Number(p.estoque))}"></div>
        </div>
        <label class="check"><input type="checkbox" id="t-pronta"${p.pronta_entrega?" checked":""}> Pronta entrega (vende o que tem em estoque)</label>

        <label class="check"><input type="checkbox" id="t-ativo"${p.ativo?" checked":""}> Ativo (aparece nas buscas)</label>
      </div>
      <details class="card"><summary>Para entrega e frete (opcional)</summary>
        <div class="grid4" style="margin-top:14px">

          <div><label class="f" for="t-larg">Largura (cm)</label><input class="in" id="t-larg" inputmode="decimal" value="${v(p.largura_cm)}"></div>
          <div><label class="f" for="t-comp">Comprimento (cm)</label><input class="in" id="t-comp" inputmode="decimal" value="${v(p.comprimento_cm)}"></div>

  };

// Reduz a foto para no máximo 1200px e sobe para o Storage. O banco guarda só o link.
async function uploadFoto(file){
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("arquivo não é imagem")); i.src=URL.createObjectURL(file); });
  const k=Math.min(1,1200/Math.max(img.width,img.height)), c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(img.src);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));
  const path=`${S.user.id}/${crypto.randomUUID()}.jpg`;
  const { error } = await sb.storage.from("produtos").upload(path, blob, { contentType:"image/jpeg", cacheControl:"31536000" });
  if(error) throw error;
  return sb.storage.from("produtos").getPublicUrl(path).data.publicUrl;
}
function storagePath(url, bucket){ const m=String(url||"").match(new RegExp(`/storage/v1/object/public/${bucket}/(.+)$`)); return m?decodeURIComponent(m[1]):null; }

    <div class="items">${(v.itens||[]).map(i=>`<div><span>${esc(num(i.qtd))} ${esc(i.unidade)} · ${esc(i.nome)}</span><span>${brl(i.preco*i.qtd)}</span></div>`).join("")}</div>
    <div class="small">Comprador: <b style="color:var(--ink)">${esc(v.comprador)}</b> ${starsHTML(v.nota,v.n_aval)}${v.cidade?` · ${esc(v.cidade)}`:""}
      ${v.celular?` · <a href="${zap(v.celular)}" target="_blank" rel="noopener"><b>WhatsApp ${esc(v.celular)}</b></a>`:""}${v.endereco?`<br>Entregar em: ${esc(v.endereco)}`:""}</div>
    ${v.status==="aguardando_pagamento"?`<div class="small">Aguardando o pagamento do comprador. Não separe ainda.</div>`:""}
    ${prox(v).length?`<div style="display:flex;gap:8px;flex-wrap:wrap">${prox(v).map(([s,t],i)=>`<button class="btn sm ${i===0?"dark":""}" data-st="${v.id}" data-to="${s}">${t}</button>`).join("")}</div>`:""}
    ${v.status==="entregue"?(v.minha_nota==null?rateWidget(v.id,"o comprador "+v.comprador):`<div class="small">Sua avaliação do comprador: ${"★".repeat(v.minha_nota)}${"☆".repeat(5-v.minha_nota)}</div>`):""}
  </div>`).join("");
  $$("[data-st]").forEach(b=>b.onclick=async()=>{ b.disabled=true; const { error }=await sb.rpc("atualizar_venda",{p_id:+b.dataset.st,p_status:b.dataset.to}); if(error){ b.disabled=false; return toast(errMsg(error)); } vVendas(); });

}
